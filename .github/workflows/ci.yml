name: ci

on:
  push:
  pull_request:

jobs:
  rom:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and emulator runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 \
            libgl1 libx11-6 libxi6 libxcursor1 libasound2t64

      - name: Fetch Linux emulator artifact
        run: |
          rm -rf .ci-rp6502-artifacts
          mkdir -p .ci-rp6502-artifacts
          gh api repos/picocomputer/rp6502/actions/artifacts/9388955581/zip > .ci-rp6502-artifacts/rp6502-linux-x86_64.tar.gz
          tar -xzf .ci-rp6502-artifacts/rp6502-linux-x86_64.tar.gz -C .ci-rp6502-artifacts
          test -f .ci-rp6502-artifacts/rp6502-emu
          install -m 755 .ci-rp6502-artifacts/rp6502-emu tools/rp6502-emu

      - name: Setup LLVM-MOS SDK
        uses: llvm-mos/setup-llvm-mos-sdk@v1

      - name: Build the ROM
        run: |
          cmake --preset llvm-mos/Release
          cmake --build --preset llvm-mos/Release

      - name: Run verification tests
        run: ctest --preset llvm-mos/Release

      - uses: actions/upload-artifact@v4
        with:
          name: RPPacMan.rp6502
          path: build/llvm-mos/release/RPPacMan.rp6502

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: emu-scratch
          path: build/llvm-mos/release/tests/scratch/
